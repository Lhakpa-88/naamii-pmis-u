name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_ADMIN_URL: postgres://postgres@127.0.0.1:5433/naamii_pmis
      DATABASE_URL: postgres://pmis_app@127.0.0.1:5433/naamii_pmis
      PMIS_AUTH_MODE: password
      SESSION_SECRET: ci-only-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Build shared core
        run: npm run build -w @naamii/core
      - name: Unit tests (calculations, health rules)
        run: npm run test -w @naamii/core
      - name: Migrate + seed demo data
        run: npm run db:migrate && npm run db:seed
      - name: Authorization tests (the 7 critical RBAC cases, against real Row Level Security)
        run: npm run test -w @naamii/db
      - name: Data-entry tests (Excel template, import and forms, against real Row Level Security)
        run: npm run test -w @naamii/app
      - name: Lint + build app
        run: npm run lint -w @naamii/app && npm run build -w @naamii/app
